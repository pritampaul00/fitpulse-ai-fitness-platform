spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/fitness-oauth2
          jwk-set-uri: http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/certs

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: activity-service
          uri: lb://ACTIVITY-SERVICE
          predicates:
            - Path=/api/activities/**

        - id: goals-service
          uri: lb://ACTIVITY-SERVICE
          predicates:
            - Path=/api/goals/**

        - id: workout-plans-service
          uri: lb://ACTIVITY-SERVICE
          predicates:
            - Path=/api/workout-plans/**

        - id: ai-service
          uri: lb://AI-SERVICE
          # uri: http://localhost:8083
          predicates:
            - Path=/api/recommendations/**,/api/coach/**,/api/goal-insights/**,/api/ai/workout-plans/**

server:
  port: 8080

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
